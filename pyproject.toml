[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diff-guard"
version = "0.1.0"
description = "Blast radius analyzer for AI-generated code changes. Catches the butterfly effect before you commit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shivam Johri", email = "shivamjohri247@gmail.com" }]
keywords = [
    "git",
    "diff",
    "ai",
    "coding-agent",
    "blast-radius",
    "code-review",
    "pre-commit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
]

# Zero mandatory external dependencies — uses only Python stdlib
dependencies = []

[project.urls]
Homepage = "https://github.com/Shivamjohri247/diff-guard"
Repository = "https://github.com/Shivamjohri247/diff-guard"
Issues = "https://github.com/Shivamjohri247/diff-guard/issues"
Changelog = "https://github.com/Shivamjohri247/diff-guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
js = [
    "tree-sitter>=0.22",
    "tree-sitter-javascript>=0.22",
    "tree-sitter-typescript>=0.22",
]
full = [
    "tree-sitter>=0.22",
    "tree-sitter-javascript>=0.22",
    "tree-sitter-typescript>=0.22",
    "tree-sitter-python>=0.22",
    "tree-sitter-go>=0.22",
]
github = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
diff-guard = "diff_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diff_guard"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
