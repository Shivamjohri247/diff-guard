name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --tb=short -q --cov=diff_guard --cov-fail-under=80

      - name: Type check
        run: mypy src/diff_guard/ --strict

      - name: Lint
        run: ruff check src/diff_guard/ tests/

      - name: Format check
        run: ruff format --check src/diff_guard/ tests/
